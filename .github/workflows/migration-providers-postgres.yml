name: Migration provider architecture gate

# Phase 26D hotfix (2026-09-15): the production `migrate deploy` against
# Neon failed with `type "datetime" does not exist` because the PostgreSQL
# schema shared prisma/migrations with SQLite. This gate proves — on a REAL
# PostgreSQL and with the REAL Prisma engine — that:
#   * the PostgreSQL migrations directory (prisma/postgres/migrations) applies
#     cleanly from empty AND from the failed-production (pre-26D + failed
#     ledger row) state, converging exactly to the generated baseline schema;
#   * fresh SQLite still applies all 12 SQLite migrations;
#   * applied migration files stay byte-frozen (checksum contract);
#   * the read-only production checker behaves (including under a SELECT-only
#     role).
#
# This job is a HARD GATE: a skip is NOT a pass. If either the PG part or the
# engine part skips, this job FAILS.
#
# SAFETY: the database is a disposable GitHub Actions service container with
# throwaway credentials. No repository secret is used; the test itself refuses
# production/Neon-looking URLs and non-local hosts.

on:
  push:
    branches: ["arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  migration-providers:
    name: Migration provider architecture test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Matches the current production target (PostgreSQL 17).
        image: postgres:17
        env:
          # Disposable CI-only credentials. These are NOT secrets.
          POSTGRES_DB: codemind_migrations
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historical pre-26B baseline is checksum-pinned by the recovery test.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node ">=22".
          node-version: 22
          cache: npm

      # Full install (the engine part needs the prisma CLI; its engine
      # binaries download from binaries.prisma.sh, which is reachable from
      # GitHub Actions runners).
      - name: Install dependencies
        run: npm ci

      # DATABASE_URL points ONLY at the disposable service container.
      # MIGRATION_PROVIDERS_PRISMA_BIN turns on the real-engine proofs.
      - name: Run the migration provider architecture test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codemind_migrations
          MIGRATION_PROVIDERS_PRISMA_BIN: node_modules/.bin/prisma
        run: |
          set -o pipefail
          node tests/migration-providers.test.js 2>&1 | tee providers.log

      # The gates. A skip is a failure: every part must really execute.
      - name: Enforce that every part really ran
        if: always()
        run: |
          if [ ! -f providers.log ]; then
            echo "::error::providers.log missing — the test never ran."
            exit 1
          fi
          if grep -q "MIGRATION_PROVIDERS_PG_SKIPPED" providers.log; then
            echo "::error::The PostgreSQL part SKIPPED. A skip is NOT a pass for this gate."
            echo "--- output ---"; cat providers.log
            exit 1
          fi
          if grep -q "MIGRATION_PROVIDERS_ENGINE_SKIPPED" providers.log; then
            echo "::error::The Prisma-engine part SKIPPED. A skip is NOT a pass for this gate."
            echo "--- output ---"; cat providers.log
            exit 1
          fi
          if grep -q "REFUSING TO RUN" providers.log; then
            echo "::error::The test refused to run against this DATABASE_URL."
            exit 1
          fi
          if ! grep -q "MIGRATION_PROVIDERS_PG_OK" providers.log; then
            echo "::error::The PostgreSQL part did not complete successfully."
            echo "--- output ---"; cat providers.log
            exit 1
          fi
          if ! grep -q "MIGRATION_PROVIDERS_ENGINE_OK" providers.log; then
            echo "::error::The Prisma-engine part did not complete successfully."
            echo "--- output ---"; cat providers.log
            exit 1
          fi
          echo "Confirmed: provider architecture proofs executed against real PostgreSQL + the real Prisma engine."

      - name: Prove guarded historical Group reconciliation and Prisma recovery
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codemind_migrations
          MIGRATION_PROVIDERS_PRISMA_BIN: node_modules/.bin/prisma
        run: |
          set -o pipefail
          node tests/group-track-recovery-postgres.test.mjs 2>&1 | tee group-recovery.log
          ! grep -q 'ENGINE_SKIPPED' group-recovery.log
          grep -q 'GROUP_TRACK_RECOVERY_PG17_OK' group-recovery.log
          grep -q 'GROUP_TRACK_RECOVERY_ENGINE_OK' group-recovery.log

      - name: Application regressions, generated client and PostgreSQL build
        env:
          DATABASE_URL: file:./ci-diagnostic-only.db
          # Public disposable CI value only; NEVER use for a production deployment.
          SECURITY_HASH_SECRET: codemind-ci-only-not-for-production-security-hash-secret
        run: |
          node tests/pg-baseline-inspection.test.mjs
          node scripts/verify-phase26d-teacher.mjs
          node tests/phase26d-teacher-full-flow.test.js
          node scripts/verify-phase26b-group-track.mjs
          node scripts/verify-phase26b-student.mjs
          node tests/track-architecture-phase12.test.js
          node scripts/verify-phase21-migration.mjs
          node tests/migration-sql.test.js
          npx prisma generate
          npx tsc --noEmit
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/codemind_migrations npm run build:postgres

      # Run only after all recovery proofs and the application build succeed.
      - name: Generate and validate trusted PostgreSQL 17 pre-26D reference
        env:
          # Fixed disposable service target, never a repository secret or Neon URL.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codemind_recovery_reference_test
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import pg from 'pg';
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          assert.equal(process.env.DATABASE_URL, 'postgresql://postgres:postgres@localhost:5432/codemind_recovery_reference_test');
          const sql = fs.readFileSync('prisma/postgres/migrations/0_init/migration.sql', 'utf8');
          assert.equal(crypto.createHash('sha256').update(sql).digest('hex'),
            'c7f5d3fa76931d02e48c5cd2c4bfdb972c0f25e528e3c0c116736d3729cefa80');
          const admin = new pg.Client({connectionString: 'postgresql://postgres:postgres@localhost:5432/postgres', connectionTimeoutMillis: 10000});
          try {
            await admin.connect();
            const version = (await admin.query('SHOW server_version_num')).rows[0].server_version_num;
            assert.equal(Math.floor(Number(version) / 10000), 17);
            // The recovery proof uses this name and later applies 26D there.
            // Recreate it so the exported reference contains ONLY pristine 0_init.
            await admin.query('DROP DATABASE IF EXISTS codemind_recovery_reference_test');
            await admin.query('CREATE DATABASE codemind_recovery_reference_test TEMPLATE template0');
          } finally { await admin.end(); }
          const reference = new pg.Client({connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000});
          try {
            await reference.connect();
            await reference.query('BEGIN');
            try {
              await reference.query(sql);
              await reference.query('COMMIT');
            } catch (error) {
              await reference.query('ROLLBACK');
              throw error;
            }
          } finally { await reference.end(); }
          NODE
          node scripts/db/inspect-pg-baseline.mjs > pg17-0-init.json
          node scripts/db/inspect-pg-baseline.mjs --reference pg17-0-init.json > pg17-0-init-verification.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {validateReference} from './scripts/db/reconcile-group-track-scope.mjs';
          const reference = JSON.parse(fs.readFileSync('pg17-0-init.json', 'utf8'));
          validateReference(reference);
          assert.match(reference.server, /^17\./);
          assert.equal(reference.repositoryInitSha256,
            'c7f5d3fa76931d02e48c5cd2c4bfdb972c0f25e528e3c0c116736d3729cefa80');
          const column = reference.catalog.columns.find(c => c.table_name === 'Group' && c.column_name === 'trackScope');
          assert.equal(column.type, '"TrackScope"');
          assert.equal(column.not_null, false);
          assert.equal(column.default_expression, null);
          assert.deepEqual(reference.catalog.enums.find(e => e.name === 'TrackScope').values, ['SHARED', 'ARABIC', 'LANGUAGE']);
          assert.equal(reference.groupRows, '0');
          assert.deepEqual(reference.audience, []);
          assert.deepEqual(reference.ledger, []);
          const verification = JSON.parse(fs.readFileSync('pg17-0-init-verification.json', 'utf8'));
          assert.deepEqual(verification.differences, []);
          console.log('PG17_0_INIT_REFERENCE_VALID: pristine enum baseline, empty Group/ledger, zero catalog differences');
          NODE
          git rev-parse HEAD
          sha256sum prisma/postgres/migrations/0_init/migration.sql
          sha256sum pg17-0-init.json

      - name: Upload trusted pre-26D reference
        uses: actions/upload-artifact@v4
        with:
          name: pg17-0-init-reference
          path: pg17-0-init.json
          if-no-files-found: error

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-providers-output
          path: |
            providers.log
            group-recovery.log
          if-no-files-found: warn