name: PG17 trusted catalog references (pre-26D + POST-26D full chain)

# Phase 26D production recovery is COMPLETE and verified. This workflow does
# NOT touch production again and performs NO production mutation. It builds
# the final independent, trusted catalog references on completely disposable
# PostgreSQL 17 GitHub Actions service containers:
#
#   Job 1 — pg17-0-init-reference (PRE-26D, preserved at full strength)
#     Fresh PG17 + the REAL Prisma engine applies EXACTLY 0_init; the
#     read-only inspector captures pg17-0-init.json.
#
#   Job 2 — pg17-full-chain-phase26d-reference (POST-26D, the mission)
#     Fresh PG17 + the REAL Prisma engine applies EXACTLY the current
#     PostgreSQL migration chain from prisma/postgres/migrations
#     (0_init + 20260915180000_phase26d_quiz_attempt_architecture +
#      20260919120000_phase_f_live_session_lifecycle +
#      20260919180000_phase_g_quiz_homework_workflow +
#      20260919190000_phase_g_camera_policy +
#      20260920120000_phase_h_progression_override +
#      20260921120000_session_video_progression_requirement +
#      20260921180000_session_video_requirement_modes +
#      20260922090000_readiness_reminder_recipients), proving:
#       * migrations apply cleanly from empty,
#       * `prisma migrate status` is clean ("Database schema is up to date!"),
#       * a second `prisma migrate deploy` is a no-op
#         ("No pending migrations to apply."),
#     then the read-only inspector captures pg17-full-chain-phase26d.json,
#     which is validated (PG major 17, pinned 0_init SHA-256, native
#     TrackScope, exact labels, all Phase26D objects, no invalid indexes,
#     no unvalidated constraints, zero self-comparison differences) BEFORE
#     being uploaded.
#
# The maintainer later compares live Neon against the downloaded reference
# with the READ-ONLY inspector:
#   DATABASE_URL='<secure read-only URL>' \
#     node scripts/db/inspect-pg-baseline.mjs \
#     --reference pg17-full-chain-phase26d.json > live-full-chain-comparison.json
# Success = exit code 0 and "differences": []. That comparison writes a local
# evidence file only; it authorizes no mutation.
#
# SAFETY: disposable localhost PostgreSQL with throwaway credentials only.
# No repository secrets, no Neon URL, no production DATABASE_URL, nothing
# production-looking in any connection string. Application code, the Prisma
# schema and all migration SQL are untouched by this workflow (the pre-26D
# job assembles its migrations bundle by COPYING files byte-for-byte).
#
# This workflow ADDS verification only: the existing recovery/provider/
# application regression gates in migration-providers-postgres.yml and
# phase26d-postgres-concurrency.yml remain intact and authoritative.
#
# PHASE 26G — PREPARED FOR DELIVERY TO main (2026-09-16).
#   This file previously existed ONLY on the auxiliary branch
#   `arena/pg17-full-chain-reference` (commit 1a7f9ab), which was never
#   merged, so the permanent, reproducible proof that a clean PostgreSQL 17
#   database migrates from ZERO to the current schema was not reachable from
#   main and did not protect any branch or PR.
#
#   CURRENT STATE — INCLUDED IN THE PHASE 26G DELIVERY, PENDING PUSH / PR /
#   MERGE, NOT YET ON main.
#     This file is part of the Phase 26G branch
#     `arena/01a0a89c-codemind-academy`, based on main @ 95b41d0. That branch
#     has NOT been pushed or merged, so this workflow is not on main yet: the
#     automation credential in use cannot create or update files under
#     .github/workflows/ without the `workflows` permission, and the phase
#     deliberately does not split, discard or rewrite the commit history to
#     work around that. One push with a credential carrying the `workflows`
#     scope is all that is required; nothing else about this file depends on
#     the push.
#
#   CONTENT — the workflow itself (triggers, jobs, steps, env pins) is
#     promoted byte-for-byte from the source branch. The two migration SHA-256
#     pins were re-verified against main: 0_init = c7f5d3fa…, 26D = 2c1bdde1….
#     Only this comment block was edited, to state the delivery status
#     accurately. No workflow behaviour is changed.
#
#   ONCE MERGED, the proof is permanently maintained on main and runs on every
#   arena/** push and on every PR to main.
#   Read-only, disposable PostgreSQL only — no production system is touched.
#
# PHASE F — WORKFLOW UPDATE REQUIRED BY THE PHASE F MIGRATION (2026-09-19).
#   The PostgreSQL chain now holds THREE migrations:
#     0_init
#     20260915180000_phase26d_quiz_attempt_architecture
#     20260919120000_phase_f_live_session_lifecycle
#     20260919180000_phase_g_quiz_homework_workflow
#     20260919190000_phase_g_camera_policy   <- PHASE G, NEW
#
#   WHY THIS FILE MUST CHANGE (verification only — no production access):
#     * the PRE-26D job assembles its 0_init-only bundle by copying
#       prisma/postgres/migrations and deleting the later directories, then
#       asserting that EXACTLY ONE directory (0_init) is left. With the Phase F
#       directory present it would find two and FAIL;
#     * the POST-26D validator asserted a two-row ledger, so the real three-row
#       chain would FAIL it;
#     * the Phase F SQL was not byte-pinned and none of its catalog objects
#       were asserted, so CI did not protect Phase F at all.
#
#   WHAT THIS UPDATE CHANGES (all assertions stay at full strength):
#     * new byte-frozen pin PHASE_F_SQL_SHA256 + `sha256sum -c` before apply;
#     * the pre-26D bundle now removes BOTH later migration directories (the
#       "exactly one directory = 0_init" assertions are untouched), and the
#       pre-26D reference validator additionally proves the bundle carries NO
#       Phase F object, so the pre-state is genuinely pre-Phase-F;
#     * the full-chain deploy log must mention the Phase F migration; the
#       ledger must be exactly the three migrations, in order, each applied
#       once; and the Phase F tables, enum labels, columns, indexes and
#       constraints are asserted BY NAME;
#     * the full chain must match the measured catalog size exactly:
#         594 columns / 94 enum values / 185 indexes /
#         185 primary+unique+foreign-key constraints
#       (the read-only inspector excludes _prisma_migrations in every section,
#       so these counts are the real schema, not the ledger table. The constraint
#       count is the p/u/f SUBSET because the raw pg_constraint total is
#       PostgreSQL-major dependent: PG18 additionally stores NOT NULL as
#       contype 'n', PG17 — the CI service container and the production target —
#       keeps NOT NULL on pg_attribute.)
#
#   Artifact, job and file names keep their historical "phase26d" labels: the
#   captured JSON is a cumulative FULL-CHAIN reference and renaming it would
#   break the maintainer's documented read-only comparison command.
#
# PHASE H / SESSION-VIDEO / READINESS — WORKFLOW UPDATE (2026-09-22).
#   The PostgreSQL chain now holds NINE migrations (0_init + 26D + F + G +
#   camera + H + session-video requirement + session-video modes + readiness
#   recipients). The contract below was brought current WITHOUT touching any
#   migration, schema or business logic (verification-only change):
#     * the PRE-26D bundle step now uses WHITELIST isolation (keep ONLY 0_init
#       + migration_lock.toml, delete everything else) instead of a hardcoded
#       per-migration rm blacklist, which had let the four newest migrations
#       leak into the trusted historical bundle;
#     * the PRE-26D validator additionally proves the absence of every Phase
#       G / H / session-video / readiness object and pins NotificationType to
#       EXACTLY its 12 historical labels, so the frozen reference cannot drift;
#     * the POST-26D validator pins all eleven migration SHA-256s, asserts the
#       Phase G / H / session-video / readiness / K1 / K3 objects BY NAME
#       (Phase G previously had no object assertions at all), and the full
#       chain must match the measured catalog size exactly:
#           610 columns / 100 enum values / 191 indexes /
#           192 primary+unique+foreign-key constraints
#       (Phase K3 swaps the global Lesson_officialCode_key unique for the
#       level-scoped Lesson_academicLevel_officialCode_key — one unique out,
#       one in — and adds the MockExam_courseId_idx index: 190 → 191 indexes,
#       p/u/f constraints unchanged at 192);
#       (measured on a real PostgreSQL engine via the read-only inspector's
#       own queries; the p/u/f subset is PostgreSQL-major-stable, the raw
#       pg_constraint total is not: 192 on PG17, 611 on PG18);
#     * the POST-26D ledger must be exactly the eleven migrations in order, and
#       the reference's recorded repository checksums must cover EXACTLY the
#       same set, so a future migration fails loudly here instead of drifting.

on:
  push:
    branches: ["arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Byte-frozen provenance pins (also enforced by tests/migration-providers.test.js).
  INIT_SQL_SHA256: c7f5d3fa76931d02e48c5cd2c4bfdb972c0f25e528e3c0c116736d3729cefa80
  PHASE26D_SQL_SHA256: 2c1bdde167f7dfff9b79a61f116da3dbd93b13c6aa27825404a79312ec7be104
  PHASE_F_SQL_SHA256: 186f921f184b21bafc5c65ffa514bd526dd614f21227a4afd2462ca5d971d388
  PHASE_G_SQL_SHA256: e16d1b6d454af5dd332727e869400ffa281d6f953b934007bc5e968e2fb05099
  PHASE_G_CAMERA_SQL_SHA256: b34ddf74f0cd88fedf41baec4dc6d6dcb305a4a9da47989e918e19d89460ed24
  PHASE_H_SQL_SHA256: f5481f3844f347920d945ba0936fe167435a7df395102af88cc3a4fee967a98f
  SESSION_VIDEO_REQ_SQL_SHA256: dea2dd69badf709a2e2dda87735baca7da68cc0f355d03f556f82e42e9cba687
  SESSION_VIDEO_MODES_SQL_SHA256: 77f073e7973f396b3d29bbe774428acf9c77538f763afbbcc7424176b418fa88
  READINESS_REMINDER_SQL_SHA256: 80cb5f164b947869a6c333b5bd3b27434dc2ac5809552b6eeb3b8085a97f0513
  K1_ACADEMIC_LEVEL_SQL_SHA256: 5c367c4a0a330c0486b1e6a130b5082b6e12b7596d7ed83871aaf58f7295bead
  K3_ACADEMIC_LEVEL_SQL_SHA256: e5784f05973e30ae3585c4d79edb503efc720f5ff4f7c3d8fa831e47c5c6e573

  # Inline verification scripts, carried as env values (block scalars) and piped
  # into node. This keeps the change strictly workflow-only while avoiding the
  # bash heredoc limitation (a heredoc terminator cannot be indented inside a
  # YAML run block). Each script is read-only: it inspects a JSON file only.
  SAFETY_GUARD_JS: |
    const assert = require('node:assert/strict');
    const url = new URL(process.env.DATABASE_URL);
    assert(['postgres:', 'postgresql:'].includes(url.protocol), 'protocol');
    assert(url.hostname === 'localhost', 'host must be localhost');
    assert(!/neon|prod/i.test(process.env.DATABASE_URL), 'no production-looking URL');
    assert(/^codemind_.*(test|recovery|migrations)$/.test(url.pathname.slice(1)), 'disposable database name');
    console.log('SAFETY: DATABASE_URL is a disposable localhost PostgreSQL target.');

  # Usage: printf '%s' "$SELF_CHECK_JS" | node - <selfcheck.json> <LABEL>
  SELF_CHECK_JS: |
    const fs = require('node:fs');
    const assert = require('node:assert/strict');
    const file = process.argv[2];
    const label = process.argv[3] || 'REFERENCE';
    const r = JSON.parse(fs.readFileSync(file, 'utf8'));
    assert(Array.isArray(r.differences), 'differences array present in ' + file);
    assert.equal(r.differences.length, 0, 'zero differences vs the same generated reference');
    console.log(label + ' SELF-COMPARISON: differences = []');

  # The trusted PRE-26D reference must be exactly the 0_init schema on PG17.
  VALIDATE_PRE26D_REFERENCE_JS: |
    const fs = require('node:fs');
    const assert = require('node:assert/strict');
    const ref = JSON.parse(fs.readFileSync('pg17-0-init.json', 'utf8'));
    assert.equal(ref.format, 1, 'format');
    assert.equal(ref.schema, 'public', 'schema');
    assert(/^17\./.test(String(ref.server)), 'PostgreSQL major version must be 17, got ' + ref.server);
    assert.equal(ref.repositoryInitSha256, process.env.INIT_SQL_SHA256, 'repository 0_init SHA-256 pinned');
    for (const s of ['tables', 'columns', 'enums', 'constraints', 'indexes']) {
      assert(Array.isArray(ref.catalog[s]) && ref.catalog[s].length > 0, 'catalog section ' + s);
    }
    // views is legitimately empty: the schema defines none. Require only shape.
    assert(Array.isArray(ref.catalog.views), 'catalog section views');
    const c = ref.catalog.columns.filter(x => x.table_name === 'Group' && x.column_name === 'trackScope');
    assert.equal(c.length, 1, 'exactly one Group.trackScope column');
    assert.equal(c[0].type, '"TrackScope"', 'Group.trackScope must be the native TrackScope enum');
    assert.equal(c[0].not_null, false, 'Group.trackScope nullable');
    assert.equal(c[0].default_expression, null, 'Group.trackScope defaultless');
    assert.equal(c[0].attidentity, '', 'no identity');
    assert.equal(c[0].attgenerated, '', 'not generated');
    assert.equal(c[0].collation, null, 'no collation');
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'TrackScope').values,
      ['SHARED', 'ARABIC', 'LANGUAGE'], 'exact TrackScope labels');
    assert(ref.catalog.indexes.every(i => i.indisvalid && i.indisready), 'no invalid indexes');
    assert(ref.catalog.constraints.every(k => k.convalidated), 'no unvalidated constraints');
    assert.deepEqual(ref.ledger.map(r => r.migration_name), ['0_init'], 'ledger is exactly 0_init');
    assert(ref.ledger[0].finished_at, '0_init finished');
    assert.equal(ref.ledger[0].rolled_back_at, null, '0_init not rolled back');
    assert(!ref.catalog.tables.some(t => t.name === 'QuizRetryGrant'), 'pre-26D: no Phase26D tables');
    assert(!ref.catalog.columns.some(x => x.table_name === 'Quiz' && x.column_name === 'quizMode'),
      'pre-26D: no Phase26D Quiz blueprint columns');
    // Phase F must be absent too: the bundle really is the pre-Phase-F state.
    for (const name of ['AttendanceCorrection', 'AbsenceReview', 'AbsenceReasonSubmission', 'AbsenceHold']) {
      assert(!ref.catalog.tables.some(t => t.name === name), 'pre-26D: no Phase F table ' + name);
    }
    for (const [table, column] of [['Notification', 'dedupeKey'], ['Notification', 'sessionId'],
                                   ['LiveSession', 'attendanceFinalizedAt'], ['Attendance', 'markedAt']]) {
      assert(!ref.catalog.columns.some(x => x.table_name === table && x.column_name === column),
        'pre-26D: no Phase F column ' + table + '.' + column);
    }
    assert(!ref.catalog.enums.some(e => e.name === 'AbsenceReviewStatus' || e.name === 'AbsenceHoldStatus'),
      'pre-26D: no Phase F enums');
    // Phase G must be absent too: the bundle really is the pre-Phase-G state.
    for (const [table, column] of [['Quiz', 'status'], ['Quiz', 'publishedAt'], ['Quiz', 'cameraPolicy'],
                                   ['Homework', 'status'], ['Homework', 'publishedAt'], ['Homework', 'attachmentId'],
                                   ['HomeworkSubmission', 'attachmentId'], ['HomeworkSubmission', 'gradedById'],
                                   ['HomeworkSubmission', 'gradedAt']]) {
      assert(!ref.catalog.columns.some(x => x.table_name === table && x.column_name === column),
        'pre-26D: no Phase G column ' + table + '.' + column);
    }
    for (const name of ['Homework_attachmentId_fkey', 'HomeworkSubmission_attachmentId_fkey',
                        'HomeworkSubmission_gradedById_fkey']) {
      assert(!ref.catalog.constraints.some(k => k.name === name), 'pre-26D: no Phase G constraint ' + name);
    }
    // Phase H must be absent too: the bundle really is the pre-Phase-H state.
    assert(!ref.catalog.tables.some(t => t.name === 'ProgressionOverride'),
      'pre-26D: no Phase H table ProgressionOverride');
    for (const name of ['ProgressionOverride_pkey', 'ProgressionOverride_studentId_fkey',
                        'ProgressionOverride_lessonId_fkey']) {
      assert(!ref.catalog.constraints.some(k => k.name === name), 'pre-26D: no Phase H constraint ' + name);
    }
    for (const name of ['ProgressionOverride_studentId_idx', 'ProgressionOverride_lessonId_idx',
                        'ProgressionOverride_studentId_lessonId_idx']) {
      assert(!ref.catalog.indexes.some(i => i.name === name), 'pre-26D: no Phase H index ' + name);
    }
    // Session-video + readiness must be absent too: the bundle really is the
    // pre-session-video state.
    for (const [table, column] of [['SessionVideo', 'isRequiredForProgression'], ['SessionVideo', 'requirementMode'],
                                   ['SessionVideo', 'liveSessionId']]) {
      assert(!ref.catalog.columns.some(x => x.table_name === table && x.column_name === column),
        'pre-26D: no session-video column ' + table + '.' + column);
    }
    assert(!ref.catalog.constraints.some(k => k.name === 'SessionVideo_liveSessionId_fkey'),
      'pre-26D: no session-video FK');
    assert(!ref.catalog.indexes.some(i => i.name === 'SessionVideo_liveSessionId_idx'),
      'pre-26D: no session-video index');
    assert(!ref.catalog.enums.some(e => e.name === 'SessionVideoRequirementMode'),
      'pre-26D: no session-video enum');
    assert(!ref.catalog.enums.find(e => e.name === 'NotificationType').values.includes('READINESS_REMINDER'),
      'pre-26D: no readiness label');
    // NotificationType is EXACTLY the 12 historical labels: no Phase F append,
    // no readiness label. This is the frozen historical contract.
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'NotificationType').values,
      ['NEW_LESSON', 'NEW_QUIZ', 'QUIZ_RESULT', 'NEW_HOMEWORK', 'HOMEWORK_DEADLINE', 'UPCOMING_SESSION',
       'LOW_ATTENDANCE', 'MONTHLY_REPORT', 'SUBSCRIPTION_EXPIRATION', 'ANNOUNCEMENT', 'PAYMENT_APPROVED',
       'PAYMENT_REJECTED'],
      'exact pre-26D NotificationType labels (frozen history)');
    console.log('PG17_0_INIT_REFERENCE_VALID');

  # The trusted POST-26D reference must be the full PG migration chain on PG17.
  VALIDATE_FULL_CHAIN_REFERENCE_JS: |
    const fs = require('node:fs');
    const assert = require('node:assert/strict');
    const ref = JSON.parse(fs.readFileSync('pg17-full-chain-phase26d.json', 'utf8'));
    assert.equal(ref.format, 1, 'format');
    assert.equal(ref.schema, 'public', 'schema');
    assert(/^17\./.test(String(ref.server)), 'PostgreSQL major version must be 17, got ' + ref.server);
    assert.equal(ref.repositoryInitSha256, process.env.INIT_SQL_SHA256, 'repository 0_init SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260915180000_phase26d_quiz_attempt_architecture'],
      process.env.PHASE26D_SQL_SHA256, 'repository Phase26D SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260919120000_phase_f_live_session_lifecycle'],
      process.env.PHASE_F_SQL_SHA256, 'repository Phase F SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260919180000_phase_g_quiz_homework_workflow'],
      process.env.PHASE_G_SQL_SHA256, 'repository Phase G SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260919190000_phase_g_camera_policy'],
      process.env.PHASE_G_CAMERA_SQL_SHA256, 'repository Phase G camera-policy SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260920120000_phase_h_progression_override'],
      process.env.PHASE_H_SQL_SHA256, 'repository Phase H SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260921120000_session_video_progression_requirement'],
      process.env.SESSION_VIDEO_REQ_SQL_SHA256, 'repository session-video-requirement SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260921180000_session_video_requirement_modes'],
      process.env.SESSION_VIDEO_MODES_SQL_SHA256, 'repository session-video-modes SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260922090000_readiness_reminder_recipients'],
      process.env.READINESS_REMINDER_SQL_SHA256, 'repository readiness-reminder SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260923100000_k1_academic_level_capability'],
      process.env.K1_ACADEMIC_LEVEL_SQL_SHA256, 'repository K1 academic-level capability SHA-256 pinned');
    assert.equal(
      ref.repositoryMigrationChecksums['prisma/postgres/migrations/20260923180000_k3_academic_level_constraints'],
      process.env.K3_ACADEMIC_LEVEL_SQL_SHA256, 'repository K3 academic-level constraints SHA-256 pinned');
    for (const s of ['tables', 'columns', 'enums', 'constraints', 'indexes']) {
      assert(Array.isArray(ref.catalog[s]) && ref.catalog[s].length > 0, 'catalog section ' + s);
    }
    // views is legitimately empty: the schema defines none. Require only shape.
    assert(Array.isArray(ref.catalog.views), 'catalog section views');
    const col = (table, column) => ref.catalog.columns.find(x => x.table_name === table && x.column_name === column);
    // Group.trackScope is the native enum (no text lineage left).
    const ts = col('Group', 'trackScope');
    assert(ts, 'Group.trackScope exists');
    assert.equal(ts.type, '"TrackScope"', 'Group.trackScope must be the native TrackScope enum');
    assert.equal(ts.not_null, false, 'Group.trackScope nullable');
    assert.equal(ts.default_expression, null, 'Group.trackScope defaultless');
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'TrackScope').values,
      ['SHARED', 'ARABIC', 'LANGUAGE'], 'exact TrackScope labels');
    // Phase26D Quiz blueprint columns.
    for (const c of ['quizMode', 'questionCount', 'maxAttempts', 'shuffleOptions', 'difficultyPlan']) {
      assert(col('Quiz', c), 'Quiz.' + c + ' exists');
    }
    // Phase26D QuizAttempt fields.
    for (const c of ['attemptNumber', 'status', 'retryGrantId']) {
      assert(col('QuizAttempt', c), 'QuizAttempt.' + c + ' exists');
    }
    // Phase26D QuizAnswer snapshot fields.
    for (const c of ['orderIndex', 'questionType', 'promptSnapshot', 'promptArSnapshot',
                     'optionsSnapshot', 'answerSnapshot', 'explanationSnapshot',
                     'difficultySnapshot', 'marksSnapshot', 'schoolTypeSnapshot']) {
      assert(col('QuizAnswer', c), 'QuizAnswer.' + c + ' exists');
    }
    // QuizRetryGrant table.
    assert(ref.catalog.tables.some(t => t.name === 'QuizRetryGrant'), 'QuizRetryGrant table exists');
    // Expected Phase26D constraints.
    const con = name => ref.catalog.constraints.find(k => k.name === name);
    for (const name of ['QuizRetryGrant_pkey',
                        'QuizRetryGrant_studentId_fkey',
                        'QuizRetryGrant_quizId_fkey',
                        'QuizRetryGrant_grantedByUserId_fkey',
                        'QuizAttempt_retryGrantId_fkey',
                        'QuizAttempt_quizId_studentId_attemptNumber_key']) {
      assert(con(name), 'constraint ' + name + ' exists');
    }
    // Expected Phase26D indexes.
    const idx = name => ref.catalog.indexes.find(i => i.name === name);
    for (const name of ['QuizRetryGrant_studentId_quizId_idx',
                        'QuizRetryGrant_quizId_idx',
                        'QuizRetryGrant_grantedByUserId_idx']) {
      assert(idx(name), 'index ' + name + ' exists');
    }
    // ---- PHASE F objects -------------------------------------------------
    // Phase F tables (absence review, holds, reason submissions, corrections).
    for (const name of ['AttendanceCorrection', 'AbsenceReview', 'AbsenceReasonSubmission', 'AbsenceHold']) {
      assert(ref.catalog.tables.some(t => t.name === name), 'Phase F table ' + name + ' exists');
    }
    // Phase F enum labels, in enum order (appended labels must land last).
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'AbsenceReviewStatus').values,
      ['PENDING_REASON', 'PENDING_REVIEW', 'EXCUSED', 'UNEXCUSED', 'NO_ACTION_REQUIRED'],
      'exact AbsenceReviewStatus labels');
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'AbsenceHoldStatus').values,
      ['ACTIVE', 'RESOLVED'], 'exact AbsenceHoldStatus labels');
    for (const label of ['ABSENCE_FINALIZED', 'ABSENCE_REASON_SUBMITTED', 'ABSENCE_EXCUSED',
                         'ABSENCE_UNEXCUSED', 'ABSENCE_REMINDER']) {
      assert(ref.catalog.enums.find(e => e.name === 'NotificationType').values.includes(label),
        'Phase F NotificationType label ' + label + ' present');
    }
    // Phase F columns added to the pre-existing tables.
    for (const [table, column] of [
      ['Attendance', 'markedAt'], ['Attendance', 'markedByUserId'], ['Attendance', 'updatedAt'],
      ['LiveSession', 'createdByUserId'], ['LiveSession', 'updatedAt'], ['LiveSession', 'conductedAt'],
      ['LiveSession', 'endedAt'], ['LiveSession', 'originalStartAt'], ['LiveSession', 'rescheduleCount'],
      ['LiveSession', 'lastRescheduledAt'], ['LiveSession', 'rescheduledByUserId'], ['LiveSession', 'cancelReason'],
      ['LiveSession', 'cancelledAt'], ['LiveSession', 'cancelledByUserId'], ['LiveSession', 'statusChangedAt'],
      ['LiveSession', 'statusChangedByUserId'], ['LiveSession', 'substituteTeacherId'],
      ['LiveSession', 'substituteAssignedAt'], ['LiveSession', 'substituteAssignedByUserId'],
      ['LiveSession', 'attendanceFinalizedAt'], ['LiveSession', 'attendanceFinalizedByUserId'],
      ['Notification', 'sessionId'], ['Notification', 'dedupeKey'],
    ]) {
      assert(col(table, column), 'Phase F column ' + table + '.' + column + ' exists');
    }
    // Phase F keys and foreign keys (dedupe/absence uniqueness is a DATABASE rule).
    for (const name of ['AbsenceReview_attendanceId_key',
                        'AbsenceHold_absenceReviewId_key',
                        'Notification_userId_dedupeKey_key',
                        'AbsenceReview_attendanceId_fkey',
                        'AbsenceReview_groupId_fkey',
                        'AbsenceReview_sessionId_fkey',
                        'AbsenceReview_studentId_fkey',
                        'AbsenceHold_absenceReviewId_fkey',
                        'AbsenceHold_studentId_fkey',
                        'AbsenceReasonSubmission_absenceReviewId_fkey',
                        'AttendanceCorrection_attendanceId_fkey',
                        'AttendanceCorrection_sessionId_fkey']) {
      assert(con(name), 'Phase F constraint ' + name + ' exists');
    }
    // Phase F indexes (incl. the long-missing Attendance.sessionId index).
    for (const name of ['AbsenceReview_attendanceId_key',
                        'AbsenceReview_groupId_idx',
                        'AbsenceReview_sessionId_idx',
                        'AbsenceReview_status_idx',
                        'AbsenceReview_studentId_status_idx',
                        'AbsenceHold_absenceReviewId_key',
                        'AbsenceHold_sessionId_idx',
                        'AbsenceHold_studentId_status_idx',
                        'AbsenceReasonSubmission_absenceReviewId_createdAt_idx',
                        'AttendanceCorrection_attendanceId_idx',
                        'AttendanceCorrection_sessionId_idx',
                        'Attendance_sessionId_idx',
                        'LiveSession_status_startAt_idx',
                        'LiveSession_substituteTeacherId_idx',
                        'LiveSession_teacherId_startAt_idx',
                        'Notification_sessionId_idx',
                        'Notification_userId_dedupeKey_key']) {
      assert(idx(name), 'Phase F index ' + name + ' exists');
    }
    // ---- PHASE G objects (quiz/homework workflow + camera policy) -----------
    // Phase G lifecycle columns (TEXT with a PUBLISHED default, nullable
    // publishedAt; attachment/grader columns nullable by design).
    for (const [table, column] of [
      ['Quiz', 'status'], ['Quiz', 'publishedAt'], ['Quiz', 'cameraPolicy'],
      ['Homework', 'status'], ['Homework', 'publishedAt'], ['Homework', 'attachmentId'],
      ['HomeworkSubmission', 'attachmentId'], ['HomeworkSubmission', 'gradedById'],
      ['HomeworkSubmission', 'gradedAt'],
    ]) {
      assert(col(table, column), 'Phase G column ' + table + '.' + column + ' exists');
    }
    assert(col('Quiz', 'status').not_null, 'Phase G Quiz.status is NOT NULL');
    assert(col('Quiz', 'cameraPolicy').not_null, 'Phase G Quiz.cameraPolicy is NOT NULL');
    assert(col('Homework', 'status').not_null, 'Phase G Homework.status is NOT NULL');
    // Phase G history-preserving foreign keys (SET NULL, canonical names).
    for (const name of ['Homework_attachmentId_fkey',
                        'HomeworkSubmission_attachmentId_fkey',
                        'HomeworkSubmission_gradedById_fkey']) {
      assert(con(name), 'Phase G constraint ' + name + ' exists');
    }
    assert(/ON DELETE SET NULL/.test(con('Homework_attachmentId_fkey').definition),
      'Phase G Homework FK is history-preserving (SET NULL)');
    assert(/ON DELETE SET NULL/.test(con('HomeworkSubmission_gradedById_fkey').definition),
      'Phase G grader FK is history-preserving (SET NULL)');
    // Phase G adds no indexes (its columns carry no @@index in the source).
    // ---- PHASE H objects (admin progression override) -----------------------
    assert(ref.catalog.tables.some(t => t.name === 'ProgressionOverride'),
      'Phase H table ProgressionOverride exists');
    for (const c of ['id', 'studentId', 'lessonId', 'reason', 'createdByUserId', 'createdAt',
                     'expiresAt', 'revokedAt', 'revokedByUserId', 'revokeReason']) {
      assert(col('ProgressionOverride', c), 'Phase H column ProgressionOverride.' + c + ' exists');
    }
    assert.equal(ref.catalog.columns.filter(x => x.table_name === 'ProgressionOverride').length, 10,
      'Phase H table carries exactly its 10 columns');
    for (const name of ['ProgressionOverride_pkey',
                        'ProgressionOverride_studentId_fkey',
                        'ProgressionOverride_lessonId_fkey']) {
      assert(con(name), 'Phase H constraint ' + name + ' exists');
    }
    assert(/ON DELETE CASCADE/.test(con('ProgressionOverride_studentId_fkey').definition),
      'Phase H student FK cascades (override rows never orphan)');
    assert(/ON DELETE CASCADE/.test(con('ProgressionOverride_lessonId_fkey').definition),
      'Phase H lesson FK cascades (override rows never orphan)');
    for (const name of ['ProgressionOverride_pkey',
                        'ProgressionOverride_studentId_idx',
                        'ProgressionOverride_lessonId_idx',
                        'ProgressionOverride_studentId_lessonId_idx']) {
      assert(idx(name), 'Phase H index ' + name + ' exists');
    }
    // ---- SESSION-VIDEO objects (progression requirement + modes) ------------
    assert(col('SessionVideo', 'isRequiredForProgression'),
      'session-video column SessionVideo.isRequiredForProgression exists');
    assert(col('SessionVideo', 'isRequiredForProgression').not_null,
      'session-video isRequiredForProgression is NOT NULL');
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'SessionVideoRequirementMode').values,
      ['OPTIONAL', 'ALL_STUDENTS', 'ABSENT_STUDENTS'], 'exact SessionVideoRequirementMode labels');
    assert(col('SessionVideo', 'requirementMode'), 'session-video column SessionVideo.requirementMode exists');
    assert(col('SessionVideo', 'requirementMode').not_null, 'session-video requirementMode is NOT NULL');
    assert(col('SessionVideo', 'liveSessionId'), 'session-video column SessionVideo.liveSessionId exists');
    assert(!col('SessionVideo', 'liveSessionId').not_null, 'session-video liveSessionId is nullable');
    assert(con('SessionVideo_liveSessionId_fkey'), 'session-video constraint SessionVideo_liveSessionId_fkey exists');
    assert(/ON DELETE SET NULL/.test(con('SessionVideo_liveSessionId_fkey').definition),
      'session-video liveSessionId FK is history-preserving (SET NULL)');
    assert(idx('SessionVideo_liveSessionId_idx'), 'session-video index SessionVideo_liveSessionId_idx exists');
    // ---- READINESS-REMINDER object (appended NotificationType label) --------
    // The full enum is asserted EXACTLY: 12 historical labels, then the nine
    // Phase F labels in append order, then READINESS_REMINDER last (a native
    // type can only grow, so every append lands last and nothing moves).
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'NotificationType').values,
      ['NEW_LESSON', 'NEW_QUIZ', 'QUIZ_RESULT', 'NEW_HOMEWORK', 'HOMEWORK_DEADLINE', 'UPCOMING_SESSION',
       'LOW_ATTENDANCE', 'MONTHLY_REPORT', 'SUBSCRIPTION_EXPIRATION', 'ANNOUNCEMENT', 'PAYMENT_APPROVED',
       'PAYMENT_REJECTED',
       'SESSION_SCHEDULED', 'SESSION_LINK', 'SESSION_RESCHEDULED', 'SESSION_CANCELLED',
       'ABSENCE_FINALIZED', 'ABSENCE_REASON_SUBMITTED', 'ABSENCE_EXCUSED', 'ABSENCE_UNEXCUSED',
       'ABSENCE_REMINDER',
       'READINESS_REMINDER'],
      'exact full-chain NotificationType labels (history + Phase F + readiness, in order)');
    // ---- MULTI-LEVEL objects (K1 capability, K3 final constraints) ----------
    assert.deepEqual(ref.catalog.enums.find(e => e.name === 'AcademicLevel').values,
      ['FIRST_SECONDARY', 'SECOND_SECONDARY'], 'exact AcademicLevel labels (K1)');
    for (const table of ['Course', 'Student', 'Lesson']) {
      assert(col(table, 'academicLevel'), 'K1 column ' + table + '.academicLevel exists');
      assert(col(table, 'academicLevel').not_null, 'K3: ' + table + '.academicLevel is NOT NULL');
    }
    assert(!con('Lesson_officialCode_key') && !idx('Lesson_officialCode_key'),
      'K3: the global Lesson_officialCode_key unique is gone');
    assert(con('Lesson_academicLevel_officialCode_key'), 'K3 constraint Lesson_academicLevel_officialCode_key exists');
    assert.equal(con('Lesson_academicLevel_officialCode_key').contype, 'u', 'K3: level-scoped official code key is a UNIQUE constraint');
    assert(/UNIQUE \("academicLevel", "officialCode"\)/.test(con('Lesson_academicLevel_officialCode_key').definition),
      'K3: Lesson unique is exactly ("academicLevel", "officialCode")');
    assert(col('MockExam', 'courseId').not_null, 'K3: MockExam.courseId is NOT NULL');
    assert(con('MockExam_courseId_fkey'), 'K3 constraint MockExam_courseId_fkey exists');
    assert(/ON DELETE RESTRICT/.test(con('MockExam_courseId_fkey').definition),
      'K3: MockExam.courseId FK is ON DELETE RESTRICT (a course with mock exams cannot be deleted)');
    assert(idx('MockExam_courseId_idx'), 'K3 index MockExam_courseId_idx exists');
    // Catalog health.
    assert(ref.catalog.indexes.every(i => i.indisvalid && i.indisready), 'no invalid indexes');
    assert(ref.catalog.constraints.every(k => k.convalidated), 'no unvalidated constraints');
    // ---- FULL-CHAIN CATALOG SIZE (measured, exact (engine-stable)) --------
    // The read-only inspector excludes _prisma_migrations from every section,
    // so these counts describe the schema itself, not the ledger table.
    //
    // columns / enum values / indexes are identical on every supported
    // PostgreSQL major, so they are asserted RAW.
    const enumValues = ref.catalog.enums.reduce((n, e) => n + e.values.length, 0);
    const size = 'columns=' + ref.catalog.columns.length + ' enumValues=' + enumValues +
      ' indexes=' + ref.catalog.indexes.length + ' con(p+u+f)=' +
      ref.catalog.constraints.filter(k => ['p', 'u', 'f'].includes(k.contype)).length +
      ' con(total)=' + ref.catalog.constraints.length;
    assert.equal(ref.catalog.columns.length, 610, 'full chain must have 610 columns — ' + size);
    assert.equal(enumValues, 100, 'full chain must have 100 enum values — ' + size);
    assert.equal(ref.catalog.indexes.length, 191, 'full chain must have 191 indexes — ' + size);
    //
    // Constraints are asserted through their TYPED subset (p = primary key,
    // u = unique, f = foreign key), never through the raw pg_constraint total,
    // because the raw total is PostgreSQL-MAJOR DEPENDENT:
    //   * PostgreSQL 18 stores column NOT NULL specifications in pg_constraint
    //     as contype 'n' (PostgreSQL 18.0 release notes, "Store column NOT NULL
    //     specifications in pg_constraint"), which adds 419 rows for this schema
    //     (raw total 611 = 419 n + 61 p + 38 u + 93 f);
    //   * PostgreSQL 17 — the CI service container, matching the production
    //     target — keeps NOT NULL on the relation in pg_attribute instead
    //     ("Not-null constraints on relations are represented in the pg_attribute
    //     catalog, not here", PG17 docs 51.13), so pg_constraint carries only
    //     p/u/f for this schema (raw total 192).
    // The p/u/f subset is the same on both majors and is exactly the constraint
    // set the migrations create, so 192 is the stable contract. NOTHING is
    // weakened by this: every Phase F/G/H and session-video constraint is
    // additionally asserted BY NAME above, the reference is still verified
    // `convalidated` end to end, and the self-comparison and full section
    // shape checks are unchanged.
    const typedConstraints = ref.catalog.constraints.filter(k => ['p', 'u', 'f'].includes(k.contype));
    assert.equal(typedConstraints.length, 192,
      'full chain must have 192 primary/unique/foreign-key constraints — ' + size);
    // Ledger proof: the real engine applied EXACTLY the PG chain, cleanly.
    // EXPECTED_CHAIN is the single source of truth for the current chain: the
    // ledger must equal it in order, and the repository checksums recorded in
    // the reference must cover EXACTLY the same set — so a future migration
    // cannot silently land without joining this contract (it fails loudly
    // here instead of drifting).
    const EXPECTED_CHAIN = ['0_init', '20260915180000_phase26d_quiz_attempt_architecture',
       '20260919120000_phase_f_live_session_lifecycle',
       '20260919180000_phase_g_quiz_homework_workflow',
       '20260919190000_phase_g_camera_policy',
       '20260920120000_phase_h_progression_override',
       '20260921120000_session_video_progression_requirement',
       '20260921180000_session_video_requirement_modes',
       '20260922090000_readiness_reminder_recipients',
       '20260923100000_k1_academic_level_capability',
       '20260923180000_k3_academic_level_constraints'];
    assert.deepEqual(ref.ledger.map(r => r.migration_name), EXPECTED_CHAIN,
      'ledger is exactly the PostgreSQL chain, in order (never the SQLite names)');
    for (const r of ref.ledger) {
      assert(r.finished_at, r.migration_name + ' finished');
      assert.equal(r.rolled_back_at, null, r.migration_name + ' not rolled back');
      assert.equal(r.applied_steps_count, 1, r.migration_name + ' applied exactly once');
    }
    const repoPgMigrations = Object.keys(ref.repositoryMigrationChecksums || {})
      .filter(k => k.startsWith('prisma/postgres/migrations/'))
      .map(k => k.slice('prisma/postgres/migrations/'.length))
      .sort();
    assert.deepEqual(repoPgMigrations, [...EXPECTED_CHAIN].sort(),
      'every prisma/postgres/migrations directory is asserted in EXPECTED_CHAIN (none unpinned, none phantom)');
    console.log('PG17_FULL_CHAIN_PHASE26D_REFERENCE_VALID');

jobs:
  pre26d-0-init-reference:
    name: Trusted PRE-26D reference (pg17-0-init-reference)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Matches the current production target (PostgreSQL 17).
        image: postgres:17
        env:
          # Disposable CI-only credentials. These are NOT secrets.
          POSTGRES_DB: codemind_pre26d_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points ONLY at the disposable service container above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codemind_pre26d_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node ">=22".
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Safety guard — disposable localhost target only
        run: printf '%s' "$SAFETY_GUARD_JS" | node

      # Pin the migration SQL BEFORE anything is applied, and assemble a
      # pre-26D schema bundle OUTSIDE the repository by copying files
      # byte-for-byte. Prisma reads the migrations directory NEXT TO the
      # schema file, so a bundle holding ONLY 0_init makes the real engine
      # apply exactly the pre-26D state. No repository file is modified.
      - name: Assemble pre-26D engine bundle (0_init only, byte-identical copies)
        run: |
          echo "$INIT_SQL_SHA256  prisma/postgres/migrations/0_init/migration.sql" | sha256sum -c -
          BUNDLE="$RUNNER_TEMP/pre26d-schema"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp prisma/postgres/schema.prisma "$BUNDLE/schema.prisma"
          cmp prisma/postgres/schema.prisma "$BUNDLE/schema.prisma"
          cp -r prisma/postgres/migrations "$BUNDLE/migrations"
          # WHITELIST isolation: keep ONLY 0_init + migration_lock.toml and
          # delete EVERYTHING else, so the bundle is exactly the pre-26D state
          # no matter how the chain grows. (A hardcoded per-migration rm
          # blacklist previously let newer migrations — Phase H, the
          # session-video pair, the readiness recipients — leak into this
          # bundle and fail the exactly-one-directory assertion below. A
          # blacklist can never be complete; the whitelist cannot leak.)
          find "$BUNDLE/migrations" -mindepth 1 -maxdepth 1 ! -name '0_init' ! -name 'migration_lock.toml' -exec rm -rf {} +
          echo "$INIT_SQL_SHA256  $BUNDLE/migrations/0_init/migration.sql" | sha256sum -c -
          grep -q 'provider = "postgresql"' "$BUNDLE/migrations/migration_lock.toml"
          echo "Bundle migrations directory contains:"
          ls "$BUNDLE/migrations"
          # Exactly ONE migration directory (0_init); migration_lock.toml is the lock file.
          [ "$(find "$BUNDLE/migrations" -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ]
          [ "$(find "$BUNDLE/migrations" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)" = "0_init" ]
          echo "PRE26D_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Apply 0_init with the real Prisma engine
        run: |
          set -o pipefail
          npx prisma migrate deploy --schema "$PRE26D_BUNDLE/schema.prisma" 2>&1 | tee pre26d-deploy.log
          grep -q "0_init" pre26d-deploy.log

      - name: Prove migrate status is clean and a second deploy is a no-op
        run: |
          set -o pipefail
          npx prisma migrate status --schema "$PRE26D_BUNDLE/schema.prisma" 2>&1 | tee pre26d-status.log
          grep -q "Database schema is up to date" pre26d-status.log
          npx prisma migrate deploy --schema "$PRE26D_BUNDLE/schema.prisma" 2>&1 | tee pre26d-redeploy.log
          grep -qi "No pending migrations" pre26d-redeploy.log

      - name: Capture the trusted pre-26D catalog reference (read-only inspector)
        run: node scripts/db/inspect-pg-baseline.mjs > pg17-0-init.json

      - name: Validate the reference before upload
        run: printf '%s' "$VALIDATE_PRE26D_REFERENCE_JS" | node

      - name: Prove self-comparison against the same generated reference returns zero differences
        run: |
          node scripts/db/inspect-pg-baseline.mjs --reference pg17-0-init.json > pg17-0-init-selfcheck.json
          printf '%s' "$SELF_CHECK_JS" | node - pg17-0-init-selfcheck.json PRE26D

      - name: Print evidence (commit SHA, PostgreSQL version, checksums)
        run: |
          echo "git_commit_sha=$(git rev-parse HEAD)"
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();console.log('postgresql_version='+(await c.query('SHOW server_version')).rows[0].server_version);await c.end();})().catch(()=>process.exit(1))"
          sha256sum prisma/postgres/migrations/0_init/migration.sql
          sha256sum pg17-0-init.json

      - name: Upload pg17-0-init-reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg17-0-init-reference
          path: pg17-0-init.json
          if-no-files-found: error

  full-chain-phase26d-reference:
    name: Trusted POST-26D full-chain reference (pg17-full-chain-phase26d-reference)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Matches the current production target (PostgreSQL 17).
        image: postgres:17
        env:
          # Disposable CI-only credentials. These are NOT secrets.
          POSTGRES_DB: codemind_fullchain_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points ONLY at the disposable service container above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codemind_fullchain_test
      PG_SCHEMA: prisma/postgres/schema.prisma

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # package.json declares engines.node ">=22".
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Safety guard — disposable localhost target only
        run: printf '%s' "$SAFETY_GUARD_JS" | node

      # Pin EVERY migration SQL file of the chain before anything is applied.
      - name: Pin the repository migration checksums
        run: |
          echo "$INIT_SQL_SHA256  prisma/postgres/migrations/0_init/migration.sql" | sha256sum -c -
          echo "$PHASE26D_SQL_SHA256  prisma/postgres/migrations/20260915180000_phase26d_quiz_attempt_architecture/migration.sql" | sha256sum -c -
          echo "$PHASE_F_SQL_SHA256  prisma/postgres/migrations/20260919120000_phase_f_live_session_lifecycle/migration.sql" | sha256sum -c -
          echo "$PHASE_G_SQL_SHA256  prisma/postgres/migrations/20260919180000_phase_g_quiz_homework_workflow/migration.sql" | sha256sum -c -
          echo "$PHASE_G_CAMERA_SQL_SHA256  prisma/postgres/migrations/20260919190000_phase_g_camera_policy/migration.sql" | sha256sum -c -
          echo "$PHASE_H_SQL_SHA256  prisma/postgres/migrations/20260920120000_phase_h_progression_override/migration.sql" | sha256sum -c -
          echo "$SESSION_VIDEO_REQ_SQL_SHA256  prisma/postgres/migrations/20260921120000_session_video_progression_requirement/migration.sql" | sha256sum -c -
          echo "$SESSION_VIDEO_MODES_SQL_SHA256  prisma/postgres/migrations/20260921180000_session_video_requirement_modes/migration.sql" | sha256sum -c -
          echo "$READINESS_REMINDER_SQL_SHA256  prisma/postgres/migrations/20260922090000_readiness_reminder_recipients/migration.sql" | sha256sum -c -
          echo "$K1_ACADEMIC_LEVEL_SQL_SHA256  prisma/postgres/migrations/20260923100000_k1_academic_level_capability/migration.sql" | sha256sum -c -
          echo "$K3_ACADEMIC_LEVEL_SQL_SHA256  prisma/postgres/migrations/20260923180000_k3_academic_level_constraints/migration.sql" | sha256sum -c -
          echo "PostgreSQL migration chain to apply (exactly this directory, in order):"
          ls prisma/postgres/migrations

      - name: Apply the full PostgreSQL migration chain with the real Prisma engine
        run: |
          set -o pipefail
          npx prisma migrate deploy --schema "$PG_SCHEMA" 2>&1 | tee full-chain-deploy.log
          grep -q "0_init" full-chain-deploy.log
          grep -q "20260915180000_phase26d_quiz_attempt_architecture" full-chain-deploy.log
          grep -q "20260919120000_phase_f_live_session_lifecycle" full-chain-deploy.log
          grep -q "20260919180000_phase_g_quiz_homework_workflow" full-chain-deploy.log
          grep -q "20260919190000_phase_g_camera_policy" full-chain-deploy.log
          grep -q "20260920120000_phase_h_progression_override" full-chain-deploy.log
          grep -q "20260921120000_session_video_progression_requirement" full-chain-deploy.log
          grep -q "20260921180000_session_video_requirement_modes" full-chain-deploy.log
          grep -q "20260922090000_readiness_reminder_recipients" full-chain-deploy.log
          echo "Full chain applied cleanly from a fresh PostgreSQL 17 database."

      - name: Prove migrate status is clean
        run: |
          set -o pipefail
          npx prisma migrate status --schema "$PG_SCHEMA" 2>&1 | tee full-chain-status.log
          grep -q "Database schema is up to date" full-chain-status.log

      - name: Prove a second migrate deploy is a no-op
        run: |
          set -o pipefail
          npx prisma migrate deploy --schema "$PG_SCHEMA" 2>&1 | tee full-chain-redeploy.log
          grep -qi "No pending migrations" full-chain-redeploy.log

      - name: Capture the trusted POST-26D full-chain catalog reference (read-only inspector)
        run: node scripts/db/inspect-pg-baseline.mjs > pg17-full-chain-phase26d.json

      - name: Validate the reference before upload
        run: printf '%s' "$VALIDATE_FULL_CHAIN_REFERENCE_JS" | node

      - name: Prove self-comparison against the same generated reference returns zero differences
        run: |
          node scripts/db/inspect-pg-baseline.mjs --reference pg17-full-chain-phase26d.json > pg17-full-chain-phase26d-selfcheck.json
          printf '%s' "$SELF_CHECK_JS" | node - pg17-full-chain-phase26d-selfcheck.json FULL-CHAIN

      - name: Print evidence (commit SHA, PostgreSQL version, checksums)
        run: |
          echo "git_commit_sha=$(git rev-parse HEAD)"
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();console.log('postgresql_version='+(await c.query('SHOW server_version')).rows[0].server_version);await c.end();})().catch(()=>process.exit(1))"
          sha256sum prisma/postgres/migrations/0_init/migration.sql
          sha256sum pg17-full-chain-phase26d.json
          echo "Maintainer follow-up (manual, READ-ONLY, never run inside this workflow):"
